[project]
name = "multi-tenant-rag-isolation-benchmark"
version = "0.1.0"
description = "Multi-tenant RAG isolation, measured: where the tenant filter goes, which layer catches which bug, and refusals: companion code for the AI Lab on iambishal.com"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
filter-before-rank = "fbr.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbr"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
