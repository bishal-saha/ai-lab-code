[project]
name = "mcp-tool-shape-benchmark"
version = "0.1.0"
description = "Endpoint-wrapper vs task-shaped MCP tools, measured: companion code for the AI Lab on iambishal.com"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "mcp>=1.20",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "kestrel-outfitters @ git+https://github.com/bishal-saha/books-code@dec08d386d3131dce9755d74ff8d643cce4f7a11#subdirectory=_shared/kestrel",
]

[project.scripts]
tool-shape = "tool_shape.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_shape"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["live: calls a real model or API; run only with scripts/live_check.py"]
addopts = "-m 'not live'"
